name: xray
version: "26.3.27-3"
url: https://radar.mehrnet.com/install/modules/xray.yaml
os: [linux, darwin, windows]
arch: [amd64, arm64]
install:
  - name: xray
    kind: binary
    # This is the literal string embedded in the published asset's own
    # filename (xray_26.3.27_...) -- deliberately not the same as this
    # module's own top-level version above, which tracks "does this
    # module need updating at all" and can carry an extra "-N" bump
    # (wrapper-script-only revisions) the binary release itself never
    # had. See module.InstallDependency's own doc comment.
    version: "26.3.27"
    url: https://radar.mehrnet.com/releases/xray/xray_{version}_{os}_{arch}.{ext}
    path: __TOOLS_DIR__/xray
  - name: xray-prepare.sh
    kind: file
    url: https://radar.mehrnet.com/install/modules/xray-prepare.sh
    path: __MODULES_DIR__/xray-prepare.sh
  - name: xray-run.sh
    kind: file
    url: https://radar.mehrnet.com/install/modules/xray-run.sh
    path: __MODULES_DIR__/xray-run.sh
request:
  - name: config
    type: object
    required: true
  - name: socks_port
    type: number
    required: true
prepare:
  command: ["/bin/sh", "__MODULES_DIR__/xray-prepare.sh", "{{params_json}}", "{{alloc_port}}"]
run:
  command: ["/bin/sh", "__MODULES_DIR__/xray-run.sh", "{{alloc_port}}", "{{target}}", "{{timeout_ms}}"]
collect:
  format: writeout_json
response:
  - name: latency_ms
    type: number
  - name: http_code
    type: number
