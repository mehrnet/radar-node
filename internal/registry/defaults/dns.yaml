name: dns
action: dns_query
request:
  # a (default), aaaa, ns, mx, txt, cname, ptr, or srv -- see
  # internal/checks/dns's own doc comment. Not enforced as an enum
  # here (this schema has no enum concept); an unsupported value fails
  # the check itself with a clear error instead.
  - name: record
    type: string
    required: false
  - name: server
    type: string
    required: false
  # srv only -- e.g. service: sip, proto: tcp, target: example.com
  # queries _sip._tcp.example.com. Leave both empty to query target as
  # an already-fully-formed SRV name instead.
  - name: service
    type: string
    required: false
  - name: proto
    type: string
    required: false
response:
  - name: record
    type: string
  - name: answers
    type: array
  # mx-only -- each answer's own preference value, same index as
  # answers. Absent (not present in Extra at all) for every other
  # record type.
  - name: preferences
    type: array
  # srv-only, same index-per-answer convention as preferences above.
  - name: priorities
    type: array
  - name: weights
    type: array
  - name: ports
    type: array
