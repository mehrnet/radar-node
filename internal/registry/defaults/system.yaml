name: system
action: system_stats
# Field order is load-bearing: absent a per-probe choice, radar shows
# the first declared field as a probe's headline chart (see radar's
# getProbeFieldSelection, which falls back to candidates[0]). cpu_percent
# leads deliberately.
#
# There are no `summary:`/`primary:` flags here any more. They were
# retired on the frontend in favour of a per-probe, user-owned field
# choice, and kept being declared long after anything read them --
# `primary: true` sat on mem_used_percent while cpu_percent, being
# first, was the actual headline.
response:
  - name: cpu_percent
    type: number
    unit: "%"
    group: cpu
    display: gauge
  - name: load1
    type: number
    unit: load
    group: cpu
  - name: load5
    type: number
    unit: load
    group: cpu
  - name: load15
    type: number
    unit: load
    group: cpu
  - name: mem_used_percent
    type: number
    unit: "%"
    group: memory
    display: gauge
  - name: mem_total_bytes
    type: number
    unit: bytes
    group: memory
  - name: mem_available_bytes
    type: number
    unit: bytes
    group: memory
  - name: disk_used_percent
    type: number
    unit: "%"
    group: disk
    display: gauge
  - name: disk_total_bytes
    type: number
    unit: bytes
    group: disk
  - name: disk_free_bytes
    type: number
    unit: bytes
    group: disk
  - name: net_in_mbps
    type: number
    unit: mbps
    group: network
  - name: net_out_mbps
    type: number
    unit: mbps
    group: network
  - name: uptime_seconds
    type: number
    unit: s
    group: system
    display: stat
