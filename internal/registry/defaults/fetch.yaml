name: fetch
action: http_fetch
request:
  # GET (default), POST, PUT, PATCH, DELETE, or HEAD.
  - name: method
    type: string
    required: false
  # Arbitrary request headers, e.g. {"Authorization": "Bearer ..."} --
  # what lets this hit a paid/private API with its own key, not just a
  # public one.
  - name: headers
    type: object
    required: false
  - name: body
    type: string
    required: false
  # One entry per custom data point to extract from the response body,
  # keyed by whatever name should show up in this check's own extra --
  # each value is either a single {"parser": "base64"|"jq"|"regex",
  # "expr": "...", "raw": false} step, or an array of them for a
  # multi-step chain (e.g. base64-decode the whole body, then jq-select
  # a key out of the decoded JSON). expr is required for jq/regex,
  # unused for base64. raw is jq-only (same idea as real jq's own
  # --raw-input flag) -- set it when the current value is plain text,
  # not JSON, e.g. splitting a base64-decoded, newline-delimited list
  # into lines with split("\n"); without it, jq always JSON-decodes its
  # input first and a non-JSON value fails outright. See
  # internal/checks/fetch's own doc comment for the full pipeline
  # design. A field whose pipeline fails is simply absent from the
  # result, never a check failure on its own.
  - name: fields
    type: object
    required: false
response:
  # First, so it leads: this prober reported no timing at all until
  # now, which left it with nothing meaningful to headline -- bytes is
  # near-constant for most targets and a status code is categorical.
  # Time to first byte, not the full round trip (that is latency_ms,
  # which also covers reading the body); on a large response the two
  # diverge sharply and it is the first byte that says whether the
  # server answered promptly.
  - name: ttfb_ms
    type: number
    unit: ms
    group: timing
  # See http.yaml: categorical, so reported as its latest value rather
  # than charted and averaged.
  - name: http_code
    type: number
    display: stat
    group: response
  - name: bytes
    type: number
    unit: bytes
    group: response
