name: http
action: http_request
request:
  - name: method
    type: string
    required: false
  - name: expect_status
    type: string
    required: false
# Every check now measures both a cold (fresh connection) and a warm
# (Checker's own reused, keep-alive connection) round trip and reports
# both -- replacing the old mode-dependent single ttfb_ms, which meant
# a different thing depending on whether the probe happened to be
# configured warm or hard. latency_ms (every prober's own universal
# default) stays the warm figure, matching what warm mode always
# favored by default. dns_ms/connect_ms/tls_ms are only ever measured
# on the cold request -- a reused warm connection skips all three, so
# they'd read as a meaningless near-zero there.
response:
  # Order is load-bearing: absent a per-probe choice, radar leads with
  # the first *chartable* field (see radar's getProbeFieldSelection).
  # warm_ttfb_ms goes first deliberately -- it is the steady-state
  # figure, the same one latency_ms mirrors, and the number someone
  # means by "how fast is this". cold_ttfb_ms follows: a fresh
  # connection every time, so it carries DNS+connect+TLS and is
  # spikier by nature.
  - name: warm_ttfb_ms
    type: number
    unit: ms
    group: timing
  - name: cold_ttfb_ms
    type: number
    unit: ms
    group: timing
  - name: dns_ms
    type: number
    unit: ms
    group: timing
  - name: connect_ms
    type: number
    unit: ms
    group: timing
  - name: tls_ms
    type: number
    unit: ms
    group: timing
  # A status code is a category, not a quantity: averaging 200 and 404
  # gives 302, a code that never happened and means something else
  # entirely. display:stat marks it as "the latest value is the
  # answer" -- rendered as a number, and aggregated by last-value
  # rather than by mean (see radar-api's bucketByInterval).
  - name: http_code
    type: number
    display: stat
    group: response
  - name: bytes
    type: number
    unit: bytes
    group: response
